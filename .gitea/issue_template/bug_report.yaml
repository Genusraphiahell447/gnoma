name: Bug Report
about: Report something that isn't working correctly
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the issue
      placeholder: |
        1. Run `gnoma --provider anthropic`
        2. Type "..."
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gnoma version
      description: Output of `gnoma --version`
      placeholder: "gnoma 0.1.0 (abc1234, 2026-04-12)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Architecture
      placeholder: "Linux x86_64 / macOS arm64 / Windows amd64"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - mistral
        - anthropic
        - openai
        - google
        - ollama
        - llamacpp
        - N/A
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run with `--verbose` for debug output
      render: shell
