name: Feature Request
about: Suggest an improvement or new capability
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that gnoma doesn't support well?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - providers
        - tools
        - router
        - TUI
        - MCP / plugins
        - elfs (sub-agents)
        - security
        - config
        - other
    validations:
      required: false
